services:
  postgres:
    image: postgres:17-alpine
    container_name: trekie-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trekie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trekie_dev}
      POSTGRES_DB: ${POSTGRES_DB:-trekie}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
