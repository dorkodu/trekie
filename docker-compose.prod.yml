version: '3.8'
name: trekie_prod

services:
  trekie_web:
    build:
      context: .
      dockerfile: ./web/Dockerfile.prod
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production

  trekie_api:
    build:
      context: .
      dockerfile: ./api/Dockerfile.prod
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=${VIRTUAL_HOST:-trekie.dorkodu.com}
      - VIRTUAL_PORT=${API_PORT:-8015}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-trekie.dorkodu.com}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-hey@dorkodu.com}
      - VIRTUAL_PATH=/api
    expose:
      - ${API_PORT:-8015}
    restart: always
    networks:
      - app
      - nginx-proxy

  trekie_postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - PGPORT=${POSTGRES_PORT:-7007}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - app
      - nginx-proxy

volumes:
  pgdata:

networks:
  nginx-proxy:
    external: true
  app: