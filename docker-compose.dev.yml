version: '3.8'
name: app-template_dev

services:
  app-template_web:
    build:
      context: .
      dockerfile: ./web/Dockerfile.dev
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - VIRTUAL_HOST=${VIRTUAL_HOST:-trekie.dorkodu.com}
      - VIRTUAL_PORT=${WEB_PORT:-8000}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-trekie.dorkodu.com}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-hey@dorkodu.com}
      - VIRTUAL_PATH=/
    ports:
      - ${WEB_PORT:-8000}:${WEB_PORT:-8000}
    volumes:
      - ./web:/web
      - ./api:/api
      - /web/node_modules
      - /api/node_modules
    restart: always
    networks:
      - app
      - nginx-proxy

  app-template_api:
    build:
      context: .
      dockerfile: ./api/Dockerfile.dev
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - VIRTUAL_HOST=${VIRTUAL_HOST:-trekie.dorkodu.com}
      - VIRTUAL_PORT=${API_PORT:-8001}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-trekie.dorkodu.com}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-hey@dorkodu.com}
      - VIRTUAL_PATH=/api
    ports:
      - ${API_PORT:-8001}:${API_PORT:-8001}
    volumes:
      - ./api:/api
      - /api/node_modules
    restart: always
    networks:
      - app
      - nginx-proxy

  app-template_postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - PGPORT=${POSTGRES_PORT:-7000}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - app
      - nginx-proxy

volumes:
  pgdata:

networks:
  nginx-proxy:
    external: true
  app: