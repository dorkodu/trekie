version: '3.8'

services:
  trekie_api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./api:/api
      - /api/node_modules
    ports:
      - "8003:8003"
    restart: always
  trekie_web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./web:/web
      - /web/node_modules
    ports:
      - "8002:8002"
    restart: always
  trekie_postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=trekie
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
